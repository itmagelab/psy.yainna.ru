# Автоматические обновления зависимостей и экшенов.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'deps'
    ignore:
      # typescript-eslint требует typescript <6.1, а TypeScript 7 — это
      # нативный компилятор, с которым пока несовместим astro check.
      - dependency-name: typescript
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'ci'
