name: Container image

# Сборка контейнера со статикой и Caddy, публикация образа в GitHub Packages.
# Локальный токен gh обычно без scope write:packages, а у GITHUB_TOKEN
# в Actions этот доступ есть — поэтому образ собирается здесь.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/itmagelab/psy.yainna.ru
  REGISTRY: ghcr.io

jobs:
  build:
    name: Сборка и публикация
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Получить код
        uses: actions/checkout@v7

      # arm64-сборки нужны для дешёвых VPS на ARM; без qemu они не соберутся.
      - name: Настроить QEMU
        uses: docker/setup-qemu-action@v4

      - name: Войти в реестр
        uses: redhat-actions/podman-login@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Определить теги
        id: meta
        run: |
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Мультиплатформенный образ требует ручной работы:
      #   1. podman build --platform a,b собирает обе платформы, но в реестр
      #      отправляет только текущую;
      #   2. podman manifest create читает исходные образы ИЗ РЕЕСТРА,
      #      поэтому каждую платформу нужно сначала запушить отдельно —
      #      иначе «manifest unknown»;
      #   3. манифест собирается из запушенных образов и публикуется с --all.
      # Проверено на локальном registry:2.
      - name: Сборка и отправка образов по платформам
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            echo "▸ Сборка linux/${arch}"
            podman build \
              --format docker \
              --platform "linux/${arch}" \
              --build-arg "SITE_URL=https://psy.yainna.ru" \
              --build-arg "BASE_PATH=/" \
              --label "org.opencontainers.image.version=${{ steps.meta.outputs.version }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --tag "${IMAGE}:${arch}" \
              -f Containerfile .

            echo "▸ Отправка linux/${arch}"
            podman push "${IMAGE}:${arch}"
          done

      - name: Сборка манифеста
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          publish() {
            local tag="$1"
            podman manifest rm "${IMAGE}:${tag}" >/dev/null 2>&1 || true
            podman manifest create "${IMAGE}:${tag}" \
              "${IMAGE}:amd64" "${IMAGE}:arm64"
            podman manifest push --all "${IMAGE}:${tag}" "docker://${IMAGE}:${tag}"
            echo "▸ Опубликован ${IMAGE}:${tag}"
          }

          publish "${{ steps.meta.outputs.tag }}"
          publish "latest"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            publish "${{ steps.meta.outputs.version }}"
          fi

      - name: Отчёт
        if: always()
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "### Контейнер"
            echo
            echo "Образ: \`${IMAGE}:${TAG}\`"
            echo "Версия: \`${VERSION}\`"
            echo "Коммит: ${{ github.sha }}"
            echo "Платформы: linux/amd64, linux/arm64"
            echo
            echo '```bash'
            echo "podman run -d --name psy -p 80:8080 -p 443:8443 \\"
            echo "  -e DOMAIN=psy.yainna.ru -e ACME_EMAIL=ваша@почта \\"
            echo "  -v psy-caddy-data:/data -v psy-caddy-config:/config \\"
            echo "  ${IMAGE}:${TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
