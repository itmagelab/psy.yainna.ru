name: Deploy to GitHub Pages

# Пуш в master → сборка статического сайта → публикация на Pages.
# Адрес и базовый путь вычисляются автоматически, вручную ничего задавать
# не нужно: задан только домен через переменную CUSTOM_DOMAIN.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не отменяем текущий деплой: иначе сайт может остаться на середине.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Собственный домен. Задаётся в настройках репозитория:
  # Settings → Secrets and variables → Actions → Variables → CUSTOM_DOMAIN.
  # Пока переменная пустая, сайт публикуется на itmagelab.github.io/psy.yainna.ru.
  CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || '' }}

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Типы и диагностика Astro
        run: npm run check

      # GitHub Pages отдаёт проект по адресу <владелец>.github.io/<репозиторий>,
      # поэтому базовый путь должен совпадать с адресом публикации, иначе
      # не найдутся стили, шрифты и картинки.
      - name: Определить адрес и базовый путь
        id: config
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "site=https://$CUSTOM_DOMAIN" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
          elif [ "$REPO" = "$OWNER.github.io" ]; then
            # сайт пользователя или организации: без подпути
            echo "site=https://$OWNER.github.io" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "site=https://$OWNER.github.io" >> "$GITHUB_OUTPUT"
            echo "base=/$REPO" >> "$GITHUB_OUTPUT"
          fi
          echo "Адрес: ${{ steps.config.outputs.site }}, базовый путь: ${{ steps.config.outputs.base }}"

      - name: Сборка
        run: npm run build
        env:
          SITE_URL: ${{ steps.config.outputs.site }}
          BASE_PATH: ${{ steps.config.outputs.base }}

      - name: Добавить CNAME (если задан собственный домен)
        if: ${{ env.CUSTOM_DOMAIN != '' }}
        run: echo "$CUSTOM_DOMAIN" > dist/CNAME

      - name: Загрузить артефакт
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Настроить Pages
        uses: actions/configure-pages@v6

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v5
